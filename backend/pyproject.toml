[project]
name = "agentcy-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "chromadb>=0.6",
    "langgraph>=0.2.50",
    "anthropic>=0.40",
    "openai>=1.55",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `tests/`, `scripts/` and `data/` sit beside `app/` but are not part of the
# distribution — name the one package explicitly so discovery stops guessing.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
