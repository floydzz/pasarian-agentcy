services:
  mysql:
    image: mysql:8.4
    container_name: agentcy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: agentcy_root
      MYSQL_DATABASE: agentcy
      MYSQL_USER: agentcy
      MYSQL_PASSWORD: agentcy_pw
    ports:
      # Published so the test suite and any local tooling can reach the same
      # server the container uses. 3308 because 3307 is taken on this machine.
      - "3308:3306"
    volumes:
      - agentcy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pagentcy_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentcy:latest
    container_name: agentcy-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Inside the network MySQL is on its own hostname and its real port — the
      # 3308 mapping above is for the host only.
      DATABASE_URL: mysql+pymysql://agentcy:agentcy_pw@mysql:3306/agentcy

      # Defaults to the offline provider so `docker compose up` works with no
      # keys and bills nothing. Override in .env to run against a real model;
      # switching EMBEDDING_PROVIDER means clearing the volume, because vectors
      # from two models are not comparable.
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-demo}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}

      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v3}

      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-demo}
      DASHSCOPE_IMAGE_MODEL: ${DASHSCOPE_IMAGE_MODEL:-wanx2.1-t2i-turbo}
      ASSETS_PATH: /data/assets

      TRENDS_GEO: ${TRENDS_GEO:-MY}
      CHROMA_PATH: /data/chroma
    ports:
      - "8000:8000"
    volumes:
      # The embedded corpora. Persisted so a restart is not a re-embedding.
      - agentcy_chroma:/data/chroma
      # Generated creatives. Persisted for the same reason the corpora are:
      # a restart must not throw away work that cost money to make.
      - agentcy_assets:/data/assets
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  agentcy_mysql_data:
  agentcy_chroma:
  agentcy_assets:
