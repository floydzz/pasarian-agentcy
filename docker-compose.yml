services:
  mysql:
    image: mysql:8.4
    container_name: agentcy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: agentcy_root
      MYSQL_DATABASE: agentcy
      MYSQL_USER: agentcy
      MYSQL_PASSWORD: agentcy_pw
    ports:
      # Published so the test suite and any local tooling can reach the same
      # server the container uses. 3308 because 3307 is taken on this machine.
      - "3308:3306"
    volumes:
      - agentcy_mysql_data:/var/lib/mysql
      # The backend suite uses a separate database so it can freely reset its
      # schema without touching the application data.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pagentcy_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentcy:latest
    container_name: agentcy-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Inside the network MySQL is on its own hostname and its real port — the
      # 3308 mapping above is for the host only.
      DATABASE_URL: mysql+pymysql://agentcy:agentcy_pw@mysql:3306/agentcy

      # Defaults to the offline provider so `docker compose up` works with no
      # keys and bills nothing. Override in .env to run against a real model.
      # Switching EMBEDDING_PROVIDER is a restart, not a volume wipe: vectors
      # from two models are not comparable, so the entrypoint clears a corpus
      # left by the previous model and re-embeds it.
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      LLM_REASONING: ${LLM_REASONING:-false}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-qwen3.6-plus}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-demo}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}

      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      CLAUDE_VISION_MODEL: ${CLAUDE_VISION_MODEL:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v3}

      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-demo}
      DASHSCOPE_IMAGE_MODEL: ${DASHSCOPE_IMAGE_MODEL:-wan2.6-image}
      MEDIA_TIMEOUT_SECONDS: ${MEDIA_TIMEOUT_SECONDS:-300}
      # Generative b-roll for the video studio. `demo` declines, which makes
      # the studio render its own scenes — the free, instant path.
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-demo}
      DASHSCOPE_VIDEO_MODEL: ${DASHSCOPE_VIDEO_MODEL:-happyhorse-1.1-t2v}
      VIDEO_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-600}
      ASSETS_PATH: /data/assets

      TRENDS_GEO: ${TRENDS_GEO:-MY}
      CHROMA_PATH: /data/chroma
    ports:
      # Uvicorn listens on 8000 inside the container.  Only the host-facing
      # side changes, so the console is reached at http://localhost:8002.
      - "8002:8000"
    volumes:
      # The embedded corpora. Persisted so a restart is not a re-embedding.
      - agentcy_chroma:/data/chroma
      # Generated creatives. Persisted for the same reason the corpora are:
      # a restart must not throw away work that cost money to make.
      - agentcy_assets:/data/assets
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  agentcy_mysql_data:
  agentcy_chroma:
  agentcy_assets:
